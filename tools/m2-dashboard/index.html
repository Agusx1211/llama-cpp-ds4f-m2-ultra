<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:*; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>M2 llama-server</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>llama-server <span class="dim">·</span> M2 Ultra</h1>
    <span id="model" class="model" title=""></span>
    <span id="build" class="dim"></span>
    <span class="spacer"></span>
    <span id="status" class="status" role="status">connecting</span>
  </header>

  <form id="key-form" hidden autocomplete="off">
    <label for="key-input">API key</label>
    <input id="key-input" type="password" spellcheck="false" autocomplete="off">
    <button type="submit">Connect</button>
    <span class="dim">or open with <code>#key=…</code> in the URL — the key stays in memory only</span>
  </form>

  <main>
    <section id="tiles" class="tiles" aria-label="throughput and capacity"></section>

    <h2>Slots</h2>
    <table id="work">
      <thead>
        <tr><th>slot</th><th>lane</th><th>request</th><th>phase</th><th class="num">t/s</th><th>progress</th><th class="num">context</th><th class="num">cached</th><th class="num">age</th><th></th></tr>
      </thead>
      <tbody id="work-body"></tbody>
    </table>
    <p id="lanes" class="lanes"></p>

    <h2>Recent requests <span id="tail-note" class="dim"></span></h2>
    <table id="tail">
      <thead>
        <tr><th>finished</th><th>slot</th><th class="num">prompt</th><th class="num">cached</th><th class="num">generated</th><th class="num">prefill t/s</th><th class="num">gen t/s</th><th class="num">duration</th></tr>
      </thead>
      <tbody id="tail-body"></tbody>
    </table>
  </main>

  <footer id="foot" class="dim"></footer>

  <div id="tooltip" class="tooltip" hidden></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
